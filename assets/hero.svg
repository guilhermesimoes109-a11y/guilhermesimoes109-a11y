  </style>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text class="eyebrow" x="400" y="62" font-size="13" letter-spacing="5">SOFTWARE DEVELOPMENT</text>
    <text class="name" x="400" y="140" font-size="66" font-weight="700">Guilherme Simões</text>
