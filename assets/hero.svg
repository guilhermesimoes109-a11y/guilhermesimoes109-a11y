<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" role="img" aria-label="Guilherme Simões - Programming and Informatics Student, ATEC Portugal">
  <style>
    .eyebrow { fill: #57606a; }
    .name    { fill: #1f2328; }
